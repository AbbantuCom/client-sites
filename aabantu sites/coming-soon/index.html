<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<meta name="description" content="Something new is on the way. Stay tuned.">
<style>
  :root{
    --bg:#0B0C10;
    --surface:#15171C;
    --primary:#6E56CF;
    --accent:#00E0C6;
    --text:#F4F4F6;
    --muted:#8A8F98;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    font-family:Arial, Helvetica, sans-serif;
  }

  body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
    padding:32px;
  }

  /* animated glow orbs */
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.55;
    animation:drift 16s ease-in-out infinite;
  }
  .orb1{
    width:380px;height:380px;
    background:var(--primary);
    top:-100px;left:-100px;
    animation-delay:0s;
  }
  .orb2{
    width:320px;height:320px;
    background:var(--accent);
    bottom:-120px;right:-80px;
    animation-delay:3s;
  }
  .orb3{
    width:220px;height:220px;
    background:var(--primary);
    top:40%;right:10%;
    animation-delay:6s;
  }

  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(40px,-30px) scale(1.15);}
  }

  /* subtle grid overlay */
  .grid-overlay{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:48px 48px;
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:1;
    max-width:720px;
  }

  .badge{
    display:inline-block;
    padding:8px 20px;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:50px;
    font-size:14px;
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:32px;
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:.1s;
  }

  h1{
    font-size:clamp(40px,8vw,84px);
    font-weight:bold;
    line-height:1.1;
    background:linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:.25s;
  }

  p.sub{
    margin-top:24px;
    font-size:20px;
    color:var(--muted);
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:.4s;
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(24px);}
    to{opacity:1; transform:translateY(0);}
  }

  .countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:56px;
    flex-wrap:wrap;
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:.55s;
  }

  .countdown .unit{
    background:var(--surface);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:24px 22px;
    min-width:100px;
  }

  .countdown .unit .num{
    font-size:42px;
    font-weight:bold;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }

  .countdown .unit .label{
    margin-top:8px;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
  }

  .pulse-dot{
    display:inline-block;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--accent);
    margin-right:10px;
    box-shadow:0 0 0 0 rgba(0,224,198,0.6);
    animation:pulse 2s infinite;
    vertical-align:middle;
  }

  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(0,224,198,0.6);}
    70%{box-shadow:0 0 0 14px rgba(0,224,198,0);}
    100%{box-shadow:0 0 0 0 rgba(0,224,198,0);}
  }

  .notify-row{
    margin-top:56px;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:.7s;
  }

  .notify-row input{
    background:var(--surface);
    border:1px solid rgba(255,255,255,0.1);
    color:var(--text);
    font-size:16px;
    padding:16px 20px;
    border-radius:50px;
    width:280px;
    outline:none;
  }

  .notify-row input::placeholder{color:var(--muted);}

  .notify-row button{
    background:var(--accent);
    color:#04201c;
    font-weight:bold;
    font-size:16px;
    padding:16px 30px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
  }

  .notify-row button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,224,198,0.35);
  }

  @media (max-width:480px){
    .countdown{gap:12px;}
    .countdown .unit{padding:18px 14px;min-width:78px;}
    .countdown .unit .num{font-size:30px;}
    .notify-row input{width:100%;}
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="grid-overlay"></div>

<div class="content">
  <span class="badge"><span class="pulse-dot"></span>Launching Soon</span>
  <h1>Something Big Is Coming</h1>
  <p class="sub">We're putting the finishing touches on a brand new experience. Check back soon.</p>

  <div class="countdown" id="countdown">
    <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>

  <div class="notify-row">
    <input type="email" placeholder="Enter your email" />
    <button type="button">Notify Me</button>
  </div>
</div>

<script>
  var target = new Date();
  target.setDate(target.getDate() + 14);

  function pad(n){ return n < 10 ? '0' + n : n; }

  function tick(){
    var now = new Date();
    var diff = target - now;
    if (diff < 0) diff = 0;

    var days = Math.floor(diff / (1000 * 60 * 60 * 24));
    var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    var minutes = Math.floor((diff / (1000 * 60)) % 60);
    var seconds = Math.floor((diff / 1000) % 60);

    document.getElementById('days').textContent = pad(days);
    document.getElementById('hours').textContent = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
