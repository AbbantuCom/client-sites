<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:'rgb(var(--b) / <alpha-value>)'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
@layer components{
.card{@apply bg-white dark:bg-[#1c1e21] rounded-xl border border-black/5 dark:border-white/10 shadow-[0_1px_0_rgba(0,0,0,.05)]}
.btn{@apply inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg border border-black/10 dark:border-white/15 bg-white dark:bg-[#26292d] hover:bg-neutral-50 dark:hover:bg-[#2f3338] active:scale-95 transition}
.btn-p{@apply inline-flex items-center justify-center gap-2 px-3.5 py-1.5 text-sm font-semibold rounded-lg bg-brand text-white hover:brightness-110 active:scale-95 transition shadow-sm disabled:opacity-40 disabled:pointer-events-none}
.inp{@apply w-full px-3 py-2 text-sm rounded-lg border border-black/15 dark:border-white/15 bg-white dark:bg-[#141517] outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand transition}
.nav{@apply flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-neutral-600 dark:text-neutral-400 hover:bg-black/5 dark:hover:bg-white/5 transition cursor-pointer}
.nav.on{@apply bg-white dark:bg-[#26292d] text-neutral-900 dark:text-white shadow-sm}
.lbl{@apply block text-xs font-medium text-neutral-500 dark:text-neutral-400 mb-1}
.pill{@apply inline-block px-2 py-0.5 rounded-full text-xs font-medium bg-brand/10 text-brand}
.st{@apply inline-block px-2 py-0.5 rounded-full text-xs font-medium}
}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.up{animation:up .35s ease both}.pop{animation:pop .2s ease both}
body{transition:background-color .3s,color .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="font-sans bg-[#f1f1f1] dark:bg-[#0f1011] text-neutral-900 dark:text-neutral-100 min-h-screen">
<div id="root"></div>
<div id="modal"></div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50"></div>

<script>
const COLORS=[['Emerald','0 128 96'],['Indigo','79 70 229'],['Rose','225 29 72'],['Amber','217 119 6'],['Sky','2 132 199'],['Slate','51 65 85']];
const RATE={USD:1,EUR:1,GBP:1,UGX:3700,KES:130};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>{const c=S?S.org.cur:'USD';return new Intl.NumberFormat('en',{style:'currency',currency:c,maximumFractionDigits:c==='UGX'?0:2}).format(n)};
const uid=()=>Math.random().toString(36).slice(2,9);
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const pref=()=>matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
let S=null, view='dashboard', q='';
try{S=JSON.parse(localStorage.getItem('erp')||'null')}catch(e){}
const save=()=>{try{localStorage.setItem('erp',JSON.stringify(S))}catch(e){}};
function wire(f,fn){const run=()=>{if(f.reportValidity())fn()};const b=f.querySelector('.btn-p');b.type='button';b.onclick=run;f.onsubmit=e=>{e.preventDefault();run()};f.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();run()}})}
function theme(){
  const o=S?S.org:{color:COLORS[0][1],mode:pref()};
  document.documentElement.classList.toggle('dark',o.mode==='dark');
  document.documentElement.style.setProperty('--b',o.color);
  document.title=S?S.org.name+' ERP':'Create your ERP';
}
function toast(m){const t=$('#toast');t.innerHTML=`<div class="pop bg-neutral-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg">${esc(m)}</div>`;setTimeout(()=>t.innerHTML='',2400)}
function swatches(sel){return COLORS.map(([n,v])=>`<button type="button" data-c="${v}" title="${n}" class="sw w-8 h-8 rounded-full ring-offset-2 dark:ring-offset-[#1c1e21] transition hover:scale-110 ${v===sel?'ring-2 ring-neutral-900 dark:ring-white':''}" style="background:rgb(${v})"></button>`).join('')}
function bindSwatches(cb){document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sw').forEach(x=>x.classList.remove('ring-2','ring-neutral-900','dark:ring-white'));b.classList.add('ring-2','ring-neutral-900','dark:ring-white');cb(b.dataset.c)})}
const field=(l,n,ph='',t='text')=>`<div><label class="lbl">${l}</label><input name="${n}" type="${t}" ${t==='number'?'min="0" step="any"':''} required class="inp" placeholder="${ph}"></div>`;
const sel=(l,n,opts)=>`<div><label class="lbl">${l}</label><select name="${n}" class="inp">${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
function sheet(inner,wide){$('#modal').innerHTML=`<div class="fixed inset-0 z-40 bg-black/40 grid place-items-center p-4" id="bd"><div class="card pop w-full ${wide?'max-w-2xl':'max-w-md'} p-6 space-y-4 max-h-[90vh] overflow-auto">${inner}</div></div>`;$('#bd').onclick=e=>{if(e.target.id==='bd')closeM()}}
const closeM=()=>$('#modal').innerHTML='';
function modal(title,body,onsub){
  sheet(`<form class="space-y-4"><h3 class="font-semibold text-lg">${title}</h3>${body}<div class="flex justify-end gap-2 pt-2"><button type="button" class="btn" id="cx">Cancel</button><button class="btn-p">Save</button></div></form>`);
  $('#cx').onclick=closeM;const f=$('#bd form');wire(f,()=>{onsub(Object.fromEntries(new FormData(f)));closeM()});
}

/* ---------- Registration ---------- */
function register(){
  theme();let color=COLORS[0][1];
  $('#root').innerHTML=`<div class="min-h-screen grid lg:grid-cols-2">
  <div class="hidden lg:flex flex-col justify-between p-12 bg-brand text-white transition-colors duration-500">
    <div class="text-xl font-bold" id="pv">Your company</div>
    <div class="up"><h1 class="text-4xl font-bold leading-tight">Buy it. Stock it.<br>Bill it.</h1>
    <p class="mt-4 text-white/80 max-w-md">Raise purchase orders, watch stock levels and send invoices from one simple workspace.</p></div>
    <div class="text-sm text-white/70">Demo build. Data stays in this browser.</div></div>
  <div class="flex items-center justify-center p-6"><form id="rf" class="card w-full max-w-md p-8 up space-y-4">
    <div><h2 class="text-2xl font-bold">Register your organisation</h2><p class="text-sm text-neutral-500 mt-1">You'll be the admin and can invite your team later.</p></div>
    <div><label class="lbl">Company name</label><input name="company" required class="inp" placeholder="Acme Trading"></div>
    <div class="grid grid-cols-2 gap-3"><div><label class="lbl">Your name</label><input name="name" required class="inp" placeholder="Jane Doe"></div>
    <div><label class="lbl">Work email</label><input name="email" type="email" required class="inp" placeholder="jane@acme.com"></div></div>
    <div class="grid grid-cols-2 gap-3"><div><label class="lbl">Password</label><input name="pw" type="password" minlength="6" required class="inp" placeholder="6+ characters"></div>
    <div><label class="lbl">Currency</label><select name="cur" class="inp"><option>USD</option><option>UGX</option><option>EUR</option><option>GBP</option><option>KES</option></select></div></div>
    <div><label class="lbl">Brand colour</label><div class="flex gap-2 py-1">${swatches(color)}</div></div>
    <button class="btn-p w-full py-2.5">Create organisation</button></form></div></div>`;
  const f=$('#rf');
  f.company.oninput=()=>$('#pv').textContent=f.company.value||'Your company';
  bindSwatches(c=>{color=c;document.documentElement.style.setProperty('--b',c)});
  wire(f,()=>{const d=Object.fromEntries(new FormData(f));
    const me={id:uid(),name:d.name,email:d.email,role:'Admin',status:'Active'};
    const rt=RATE[d.cur]||1,sc=v=>rt===1?v:Math.round(v*rt/100)*100;
    const items=[['A4 Paper Ream',3.2,5.5,120,40],['Ballpoint Pens, box of 50',4,7.5,60,20],['Heavy Duty Stapler',6,11,14,10],['Office Chair',48,89,12,8],['Standing Desk',160,285,5,4],['Laptop Bag',14,26,30,10],['Whiteboard Markers, 12pk',3.5,6.9,8,15],['Printer Toner, Black',32,55,18,6],['Desk Lamp',11,21,25,10],['Filing Cabinet',70,125,3,4]].map(([name,cost,price,stock,reorder],i)=>({id:uid(),sku:'SKU-'+(1001+i),name,unit:'pcs',cost:sc(cost),price:sc(price),stock,reorder}));
    const L=(i,qty,k)=>({item:items[i].id,qty,price:items[i][k]});
    S={org:{name:d.company,color,mode:pref(),cur:d.cur,tax:10},me:me.id,team:[me],items,
      pos:[{id:uid(),no:'PO-0001',party:'Comfort Furniture Ltd',date:day(-20),lines:[L(3,10,'cost'),L(4,4,'cost')],status:'Received'},{id:uid(),no:'PO-0002',party:'Paperline Wholesale',date:day(-4),lines:[L(7,12,'cost'),L(0,100,'cost')],status:'Ordered'},{id:uid(),no:'PO-0003',party:'Stationers Direct',date:day(-1),lines:[L(6,30,'cost'),L(1,40,'cost')],status:'Draft'}],
      invs:[{id:uid(),no:'INV-0001',party:'Brightside Schools',date:day(-30),due:day(-16),lines:[L(0,50,'price'),L(1,20,'price')],status:'Paid'},{id:uid(),no:'INV-0002',party:'Northwind Offices',date:day(-18),due:day(-4),lines:[L(3,4,'price'),L(8,6,'price')],status:'Sent'},{id:uid(),no:'INV-0003',party:'Kato & Sons Ltd',date:day(-3),due:day(11),lines:[L(5,10,'price'),L(2,5,'price')],status:'Sent'},{id:uid(),no:'INV-0004',party:'Lumen Studio',date:day(0),due:day(14),lines:[L(4,2,'price')],status:'Draft'}]};
    save();theme();shell()});
}

/* ---------- Helpers ---------- */
const it=id=>S.items.find(i=>i.id===id)||{name:'Deleted item',stock:0,cost:0,price:0};
const sub=d=>d.lines.reduce((a,l)=>a+l.qty*l.price,0);
const total=(d,inv)=>inv?sub(d)*(1+S.org.tax/100):sub(d);
const istat=i=>i.status==='Sent'&&i.due<day(0)?'Overdue':i.status;
const SC={Draft:'bg-neutral-200 text-neutral-700 dark:bg-white/10 dark:text-neutral-300',Ordered:'bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-300',Sent:'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300',Received:'bg-green-100 text-green-700 dark:bg-green-500/20 dark:text-green-300',Paid:'bg-green-100 text-green-700 dark:bg-green-500/20 dark:text-green-300',Overdue:'bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-300','In stock':'bg-green-100 text-green-700 dark:bg-green-500/20 dark:text-green-300',Low:'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300','Out of stock':'bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-300'};
const badge=s=>`<span class="st ${SC[s]}">${s}</span>`;
const sstat=i=>i.stock<1?'Out of stock':i.stock<=i.reorder?'Low':'In stock';
const onOrder=id=>S.pos.filter(p=>p.status==='Ordered').reduce((a,p)=>a+p.lines.filter(l=>l.item===id).reduce((x,l)=>x+l.qty,0),0);
const nextNo=(arr,p)=>p+String(arr.length+1).padStart(4,'0');

/* ---------- Document editor (PO / invoice) ---------- */
function docModal(kind){
  const po=kind==='po';let party='',due=day(14);
  let lines=[{item:S.items[0].id,qty:1,price:po?S.items[0].cost:S.items[0].price}];
  const tot=()=>money(total({lines},!po));
  function draw(){
    sheet(`<h3 class="font-semibold text-lg">${po?'New purchase order':'New invoice'}</h3>
    <div class="grid grid-cols-2 gap-3"><div><label class="lbl">${po?'Supplier':'Customer'}</label><input id="pty" class="inp" value="${esc(party)}" placeholder="${po?'Supplier name':'Customer name'}"></div>
    ${po?'':`<div><label class="lbl">Due date</label><input id="due" type="date" class="inp" value="${due}"></div>`}</div>
    <div class="space-y-2">${lines.map((l,i)=>`<div class="grid grid-cols-[1fr,64px,96px,24px] gap-2 items-center"><select data-i="${i}" data-f="item" class="inp">${S.items.map(x=>`<option value="${x.id}" ${x.id===l.item?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input data-i="${i}" data-f="qty" type="number" min="1" value="${l.qty}" class="inp"><input data-i="${i}" data-f="price" type="number" min="0" step="any" value="${l.price}" class="inp"><button class="text-neutral-400 hover:text-red-500" data-rm="${i}" title="Remove line">✕</button></div>`).join('')}</div>
    <button class="btn" id="al">Add line</button>
    <div class="flex justify-between items-center border-t border-black/5 dark:border-white/10 pt-3"><span class="text-sm text-neutral-500">${po?'Total':'Total incl. '+S.org.tax+'% tax'}</span><span class="text-lg font-bold" id="tt">${tot()}</span></div>
    <div class="flex justify-end gap-2"><button class="btn" id="cx">Cancel</button><button class="btn-p" id="sv">Save as draft</button></div>`,true);
    $('#pty').oninput=e=>party=e.target.value;const d=$('#due');if(d)d.oninput=e=>due=e.target.value;
    document.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{const l=lines[+el.dataset.i],f=el.dataset.f;if(f==='item'){l.item=el.value;l.price=po?it(l.item).cost:it(l.item).price;draw()}else{l[f]=Math.max(f==='qty'?1:0,+el.value||0);$('#tt').textContent=tot()}});
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(lines.length>1){lines.splice(+b.dataset.rm,1);draw()}});
    $('#al').onclick=()=>{lines.push({item:S.items[0].id,qty:1,price:po?S.items[0].cost:S.items[0].price});draw()};
    $('#cx').onclick=closeM;
    $('#sv').onclick=()=>{if(!party.trim())return toast('Enter a '+(po?'supplier':'customer')+' name');
      const arr=po?S.pos:S.invs,doc={id:uid(),no:nextNo(arr,po?'PO-':'INV-'),party:party.trim(),date:day(0),lines,status:'Draft'};if(!po)doc.due=due;
      arr.unshift(doc);save();closeM();render();toast((po?'Purchase order ':'Invoice ')+doc.no+' saved')};
  }
  draw();
}
function showDoc(kind,id){
  const po=kind==='po',arr=po?S.pos:S.invs,d=arr.find(x=>x.id===id),st=po?d.status:istat(d);
  const acts={po:{Draft:['Mark as ordered'],Ordered:['Receive stock']},inv:{Draft:['Send invoice'],Sent:['Mark as paid']}}[kind][d.status]||[];
  sheet(`<div class="flex justify-between items-start"><div><h3 class="font-semibold text-lg">${d.no}</h3><p class="text-sm text-neutral-500">${esc(d.party)} · ${d.date}${po?'':' · due '+d.due}</p></div>${badge(st)}</div>
  <table class="w-full text-sm"><thead class="text-left text-xs text-neutral-500"><tr><th class="py-2">Item</th><th>Qty</th><th>Price</th><th class="text-right">Amount</th></tr></thead><tbody>${d.lines.map(l=>`<tr class="border-t border-black/5 dark:border-white/10"><td class="py-2">${esc(it(l.item).name)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td class="text-right">${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table>
  <div class="text-sm space-y-1 text-right">${po?'':`<div class="text-neutral-500">Subtotal ${money(sub(d))} · Tax ${money(sub(d)*S.org.tax/100)}</div>`}<div class="text-xl font-bold">${money(total(d,!po))}</div></div>
  <div class="flex justify-between gap-2">${d.status==='Draft'?'<button class="btn" id="dl">Delete draft</button>':'<span></span>'}<div class="flex gap-2"><button class="btn" id="cx">Close</button>${acts.map(a=>`<button class="btn-p" id="act">${a}</button>`).join('')}</div></div>`,true);
  $('#cx').onclick=closeM;
  const dl=$('#dl');if(dl)dl.onclick=()=>{(po?S.pos=S.pos.filter(x=>x!==d):S.invs=S.invs.filter(x=>x!==d));save();closeM();render();toast('Draft deleted')};
  const a=$('#act');if(a)a.onclick=()=>{
    if(po){if(d.status==='Draft')d.status='Ordered';else{d.lines.forEach(l=>{const i=S.items.find(x=>x.id===l.item);if(i){i.stock+=l.qty;i.cost=l.price}});d.status='Received'}}
    else if(d.status==='Draft'){const bad=d.lines.find(l=>it(l.item).stock<l.qty);if(bad)return toast('Not enough stock for '+it(bad.item).name);d.lines.forEach(l=>it(l.item).stock-=l.qty);d.status='Sent'}
    else d.status='Paid';
    save();closeM();render();toast(d.no+' is now '+(po?d.status:istat(d)))};
}

/* ---------- Shell ---------- */
const NAV=[['dashboard','▦','Dashboard'],['purchases','⬓','Purchases'],['stock','▤','Stock levels'],['invoices','▥','Invoices'],['team','⚇','Team'],['settings','⚙','Settings']];
function shell(){
  theme();
  $('#root').innerHTML=`<div class="flex min-h-screen">
  <aside class="w-60 shrink-0 p-4 hidden md:flex flex-col gap-1 sticky top-0 h-screen">
    <div class="flex items-center gap-2 px-2 py-3 mb-2"><div class="w-8 h-8 rounded-lg bg-brand text-white grid place-items-center font-bold">${esc(S.org.name[0].toUpperCase())}</div><div class="font-semibold truncate">${esc(S.org.name)}</div></div>
    ${NAV.map(([id,i,l])=>`<a data-v="${id}" class="nav"><span class="w-5 text-center">${i}</span>${l}</a>`).join('')}
    <div class="mt-auto text-xs text-neutral-500 px-2">${esc(S.org.name)} ERP</div></aside>
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="flex items-center gap-3 px-4 md:px-8 py-3 sticky top-0 z-20 backdrop-blur bg-[#f1f1f1]/80 dark:bg-[#0f1011]/80">
      <select id="mnav" class="md:hidden inp w-auto">${NAV.map(([id,,l])=>`<option value="${id}">${l}</option>`).join('')}</select>
      <input id="search" class="inp max-w-md" placeholder="Search orders, items and invoices">
      <div class="ml-auto flex items-center gap-2"><button id="mode" class="btn">${S.org.mode==='dark'?'☀ Light':'☾ Dark'}</button>
      <div class="w-8 h-8 rounded-full bg-brand text-white grid place-items-center text-xs font-semibold">${ini(S.team.find(t=>t.id===S.me).name)}</div></div></header>
    <main id="main" class="px-4 md:px-8 pb-10"></main></div></div>`;
  document.querySelectorAll('[data-v]').forEach(a=>a.onclick=()=>go(a.dataset.v));
  $('#mnav').onchange=e=>go(e.target.value);
  $('#mode').onclick=()=>{S.org.mode=S.org.mode==='dark'?'light':'dark';save();shell()};
  $('#search').oninput=e=>{q=e.target.value.toLowerCase();if(!['purchases','stock','invoices'].includes(view))view='stock';render()};
  render();
}
function go(v){view=v;q='';const s=$('#search');if(s)s.value='';render()}
function render(){
  document.querySelectorAll('[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  $('#mnav').value=view;
  $('#main').innerHTML=`<div class="up">${VIEWS[view]()}</div>`;
  (BIND[view]||(()=>{}))();
}
const head=(t,sub,btn)=>`<div class="flex items-center justify-between mb-5 gap-3"><div><h1 class="text-xl font-bold">${t}</h1><p class="text-sm text-neutral-500">${sub}</p></div>${btn||''}</div>`;
const none=(c,m)=>`<tr><td colspan=${c} class="p-8 text-center text-neutral-500">${m}</td></tr>`;

/* ---------- Views ---------- */
const VIEWS={
dashboard(){
  const sv=S.items.reduce((a,i)=>a+i.cost*i.stock,0);
  const op=S.pos.filter(p=>p.status==='Ordered'),oi=S.invs.filter(i=>i.status==='Sent');
  const by={Draft:0,Sent:0,Overdue:0,Paid:0};S.invs.forEach(i=>by[istat(i)]+=total(i,1));
  const mx=Math.max(1,...Object.values(by)),low=S.items.filter(i=>i.stock<=i.reorder).sort((a,b)=>a.stock-b.stock);
  const st=[['Stock value',money(sv)],['Open purchase orders',op.length+' · '+money(op.reduce((a,p)=>a+total(p),0))],['Outstanding invoices',money(oi.reduce((a,i)=>a+total(i,1),0))],['Paid revenue',money(by.Paid)]];
  return head('Welcome, '+esc(S.team.find(t=>t.id===S.me).name.split(' ')[0]),'Here is where '+esc(S.org.name)+' stands today.')+
  `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${st.map(([l,v])=>`<div class="card p-4 hover:-translate-y-0.5 transition"><div class="text-xs text-neutral-500">${l}</div><div class="text-xl font-bold mt-1">${v}</div></div>`).join('')}</div>
  <div class="grid lg:grid-cols-2 gap-4 mt-4"><div class="card p-5"><h3 class="font-semibold mb-4">Invoices by status</h3>${Object.entries(by).map(([k,v])=>`<div class="mb-3"><div class="flex justify-between text-sm mb-1"><span>${k}</span><span class="text-neutral-500">${money(v)}</span></div><div class="h-2 rounded-full bg-black/5 dark:bg-white/10 overflow-hidden"><div class="bar h-full bg-brand rounded-full transition-all duration-700" style="width:0" data-w="${v/mx*100}"></div></div></div>`).join('')}</div>
  <div class="card p-5"><h3 class="font-semibold mb-4">Needs restocking</h3>${low.map(i=>`<div class="flex items-center gap-3 py-2 border-b last:border-0 border-black/5 dark:border-white/10"><div class="min-w-0"><div class="text-sm font-medium truncate">${esc(i.name)}</div><div class="text-xs text-neutral-500">${i.stock} on hand · reorder at ${i.reorder} · ${onOrder(i.id)} on order</div></div><span class="ml-auto">${badge(sstat(i))}</span></div>`).join('')||'<p class="text-sm text-neutral-500">Everything is above its reorder level.</p>'}</div></div>`;
},
purchases(){
  const rows=S.pos.filter(p=>(p.no+p.party).toLowerCase().includes(q));
  return head('Purchases',S.pos.length+' purchase orders','<button class="btn-p" id="addpo">New purchase order</button>')+
  `<div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="text-left text-xs text-neutral-500"><tr><th class="p-3">Order</th><th>Supplier</th><th>Date</th><th>Units</th><th>Total</th><th class="pr-3">Status</th></tr></thead><tbody>
  ${rows.map(p=>`<tr data-open="po:${p.id}" class="cursor-pointer border-t border-black/5 dark:border-white/10 hover:bg-black/[.02] dark:hover:bg-white/5 transition"><td class="p-3 font-medium">${p.no}</td><td>${esc(p.party)}</td><td class="text-neutral-500">${p.date}</td><td>${p.lines.reduce((a,l)=>a+l.qty,0)}</td><td class="font-semibold">${money(total(p))}</td><td class="pr-3">${badge(p.status)}</td></tr>`).join('')||none(6,'No purchase orders match. Create one to restock your items.')}</tbody></table></div>`;
},
stock(){
  const rows=S.items.filter(i=>(i.name+i.sku).toLowerCase().includes(q));
  return head('Stock levels',S.items.length+' items · '+S.items.filter(i=>i.stock<=i.reorder).length+' at or below reorder level','<button class="btn-p" id="addi">Add item</button>')+
  `<div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="text-left text-xs text-neutral-500"><tr><th class="p-3">Item</th><th>Cost</th><th>Price</th><th>On hand</th><th>Reorder at</th><th>On order</th><th>Value</th><th class="pr-3">Status</th></tr></thead><tbody>
  ${rows.map(i=>`<tr class="border-t border-black/5 dark:border-white/10 hover:bg-black/[.02] dark:hover:bg-white/5 transition"><td class="p-3"><div class="font-medium">${esc(i.name)}</div><div class="text-xs text-neutral-500">${i.sku}</div></td><td>${money(i.cost)}</td><td>${money(i.price)}</td><td><input type="number" min="0" data-stock="${i.id}" value="${i.stock}" class="inp !w-20 !py-1"></td><td>${i.reorder}</td><td>${onOrder(i.id)||'–'}</td><td>${money(i.cost*i.stock)}</td><td class="pr-3">${badge(sstat(i))}</td></tr>`).join('')||none(8,'No items match. Try another search or add an item.')}</tbody></table></div>`;
},
invoices(){
  const rows=S.invs.filter(i=>(i.no+i.party).toLowerCase().includes(q));
  const ov=S.invs.filter(i=>istat(i)==='Overdue').reduce((a,i)=>a+total(i,1),0);
  return head('Invoices',S.invs.length+' invoices · '+money(ov)+' overdue','<button class="btn-p" id="addinv">New invoice</button>')+
  `<div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="text-left text-xs text-neutral-500"><tr><th class="p-3">Invoice</th><th>Customer</th><th>Issued</th><th>Due</th><th>Total</th><th class="pr-3">Status</th></tr></thead><tbody>
  ${rows.map(i=>`<tr data-open="inv:${i.id}" class="cursor-pointer border-t border-black/5 dark:border-white/10 hover:bg-black/[.02] dark:hover:bg-white/5 transition"><td class="p-3 font-medium">${i.no}</td><td>${esc(i.party)}</td><td class="text-neutral-500">${i.date}</td><td class="text-neutral-500">${i.due}</td><td class="font-semibold">${money(total(i,1))}</td><td class="pr-3">${badge(istat(i))}</td></tr>`).join('')||none(6,'No invoices match. Create one to bill a customer.')}</tbody></table></div>`;
},
team(){
  return head('Team','Invite people to '+esc(S.org.name),'<button class="btn-p" id="inv">Invite user</button>')+
  `<div class="card divide-y divide-black/5 dark:divide-white/10">${S.team.map(m=>`<div class="flex items-center gap-3 p-4"><div class="w-9 h-9 rounded-full bg-brand/10 text-brand grid place-items-center text-sm font-semibold">${ini(m.name)}</div><div class="min-w-0"><div class="text-sm font-medium">${esc(m.name)}</div><div class="text-xs text-neutral-500 truncate">${esc(m.email)}</div></div><span class="pill ml-auto">${m.role}</span><span class="text-xs w-16 text-right ${m.status==='Active'?'text-green-600':'text-amber-500'}">${m.status}</span></div>`).join('')}</div>`;
},
settings(){
  return head('Settings','Company profile and appearance','')+
  `<div class="card p-6 max-w-xl space-y-5"><div class="grid grid-cols-2 gap-3"><div><label class="lbl">Company name</label><input id="sn" class="inp" value="${esc(S.org.name)}"></div><div><label class="lbl">Invoice tax rate %</label><input id="stx" type="number" min="0" class="inp" value="${S.org.tax}"></div></div>
  <div><label class="lbl">Company theme colour</label><div class="flex gap-2 py-1">${swatches(S.org.color)}</div></div>
  <div><label class="lbl">Appearance</label><div class="inline-flex rounded-lg border border-black/10 dark:border-white/15 p-0.5">${['light','dark'].map(m=>`<button data-m2="${m}" class="px-4 py-1.5 text-sm rounded-md capitalize transition ${S.org.mode===m?'bg-brand text-white':''}">${m}</button>`).join('')}</div></div>
  <div class="flex gap-2 pt-2"><button class="btn-p" id="ss">Save changes</button><button class="btn" id="rs">Reset demo</button></div></div>`;
}};
const openRows=()=>document.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>{const[k,id]=r.dataset.open.split(':');showDoc(k,id)});
const BIND={
dashboard(){setTimeout(()=>document.querySelectorAll('.bar').forEach(b=>b.style.width=b.dataset.w+'%'),60)},
purchases(){$('#addpo').onclick=()=>docModal('po');openRows()},
invoices(){$('#addinv').onclick=()=>docModal('inv');openRows()},
stock(){
  $('#addi').onclick=()=>modal('Add item',field('Item name','name','Item name')+field('SKU','sku','SKU-1011')+field('Unit cost','cost','0.00','number')+field('Selling price','price','0.00','number')+field('Opening stock','stock','0','number')+field('Reorder level','reorder','10','number'),d=>{S.items.push({id:uid(),sku:d.sku,name:d.name,unit:'pcs',cost:+d.cost,price:+d.price,stock:+d.stock,reorder:+d.reorder});save();render();toast('Item added')});
  document.querySelectorAll('[data-stock]').forEach(i=>i.onchange=()=>{S.items.find(x=>x.id===i.dataset.stock).stock=Math.max(0,+i.value||0);save();render();toast('Stock updated')});
},
team(){
  $('#inv').onclick=()=>modal('Invite a teammate',field('Name','name','Full name')+field('Email','email','name@company.com','email')+sel('Role','role',['Buyer','Accountant','Admin']),d=>{
    S.team.push({id:uid(),...d,status:'Pending'});save();render();
    const link=location.href.split('#')[0]+'#invite='+uid();navigator.clipboard?.writeText(link).catch(()=>{});toast('Invite sent. Link copied to clipboard')});
},
settings(){
  let color=S.org.color;
  bindSwatches(c=>{color=c;document.documentElement.style.setProperty('--b',c)});
  document.querySelectorAll('[data-m2]').forEach(b=>b.onclick=()=>{S.org.mode=b.dataset.m2;save();shell();go('settings')});
  $('#ss').onclick=()=>{S.org.name=$('#sn').value.trim()||S.org.name;S.org.tax=Math.max(0,+$('#stx').value||0);S.org.color=color;save();shell();go('settings');toast('Settings saved')};
  $('#rs').onclick=e=>{const b=e.target;if(b.dataset.sure){try{localStorage.removeItem('erp')}catch(x){}S=null;register()}else{b.dataset.sure=1;b.textContent='Click again to confirm';setTimeout(()=>{b.dataset.sure='';b.textContent='Reset demo'},3000)}};
}};
S?shell():register();
</script>
</body>
</html>
